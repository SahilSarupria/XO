name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (composite project build)
        run: npm run typecheck

      # Keep focused package validation ahead of known repository-wide lint debt,
      # so package regressions are visible even when the global lint gate fails.
      - name: Test Environment Intelligence
        run: npm run test -w @xo/environment-intelligence

      - name: Build Environment Intelligence
        run: npm run build -w @xo/environment-intelligence

      - name: Run Environment Intelligence demo
        run: npm run demo -w @xo/environment-intelligence

      - name: Lint Environment Intelligence
        run: npx eslint packages/environment-intelligence --max-warnings=0

      - name: Format check Environment Intelligence
        run: npx prettier --check packages/environment-intelligence docs/environment-intelligence/ARCHITECTURE.md

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # UW-17: the one production image, built and run as a user would run it (compose.yaml), then the instance smoke test against it.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Build the production image
        run: docker compose build xo

      - name: Production settings refuse to start without durable audit and package trust
        run: |
          set +e
          out=$(docker run --rm xo-instance:local 2>&1); code=$?
          echo "$out"
          test "$code" -ne 0 && echo "$out" | grep -q 'startup aborted'

      - name: Start one instance (compose defaults)
        run: docker compose up -d --wait --wait-timeout 120 xo

      - name: Issue a sign-in key
        run: echo "XO_KEY=$(docker compose exec -T xo xo instance access-key --data /data | grep -o 'xoak_[A-Za-z0-9_-]*')" >> "$GITHUB_ENV"

      - name: Smoke test the running instance
        run: node scripts/smoke-instance.mjs --url http://127.0.0.1:4000 --key "$XO_KEY"

      - name: Back up the running instance and verify the archive
        run: |
          docker compose exec -T xo xo instance backup --data /data --live --out /tmp/xo.tar.gz
          docker compose exec -T xo xo instance verify-backup /tmp/xo.tar.gz

      - name: Instance logs
        if: failure()
        run: docker compose logs xo

      - name: Stop
        if: always()
        run: docker compose down -v

  # UW-13 (ADR 0053), Revision 4 G-1: list the files a pull request changes outside pack content, sets, tests, fixtures and docs.
  # Informational until a vertical run makes it strict (`--strict`).
  generic-diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Files outside the generic allowlist
        run: node scripts/generic-diff-gate.mjs --base "origin/${{ github.base_ref }}" --head "${{ github.sha }}"

  # UW-17 (ADR 0054): the cloud template renders from its example config, and the compose file it writes is valid.
  # The rendered stack is not started here (it needs a pushed image digest and a public DNS name); see docs/INSTANCE.md.
  deploy-template:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Render both targets from the example config
        run: |
          node apps/cli/bin/xo.js deploy check --config deploy/cloud/instance.example.yaml
          node apps/cli/bin/xo.js deploy render --config deploy/cloud/instance.example.yaml --target vm --out /tmp/xo-vm
          node apps/cli/bin/xo.js deploy render --config deploy/cloud/instance.example.yaml --target kubernetes --out /tmp/xo-k8s
      - name: The rendered compose file is valid
        run: docker compose -f /tmp/xo-vm/compose.yaml config -q
