name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (composite project build)
        run: npm run typecheck

      # Keep focused package validation ahead of known repository-wide lint debt,
      # so package regressions are visible even when the global lint gate fails.
      - name: Test Environment Intelligence
        run: npm run test -w @xo/environment-intelligence

      - name: Build Environment Intelligence
        run: npm run build -w @xo/environment-intelligence

      - name: Run Environment Intelligence demo
        run: npm run demo -w @xo/environment-intelligence

      - name: Lint Environment Intelligence
        run: npx eslint packages/environment-intelligence --max-warnings=0

      - name: Format check Environment Intelligence
        run: npx prettier --check packages/environment-intelligence docs/environment-intelligence/ARCHITECTURE.md

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
