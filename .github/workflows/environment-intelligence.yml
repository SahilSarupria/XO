name: Environment Intelligence

on:
  pull_request:
    paths:
      - "packages/environment-intelligence/**"
      - "docs/environment-intelligence/**"
      - "tsconfig.json"
      - "package-lock.json"
      - ".github/workflows/environment-intelligence.yml"
  push:
    branches: [main]
    paths:
      - "packages/environment-intelligence/**"
      - "docs/environment-intelligence/**"
      - "tsconfig.json"
      - "package-lock.json"
      - ".github/workflows/environment-intelligence.yml"

permissions:
  contents: read

concurrency:
  group: environment-intelligence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck workspace
        run: npm run typecheck

      - name: Test Environment Intelligence
        run: npm run test -w @xo/environment-intelligence

      - name: Build Environment Intelligence
        run: npm run build -w @xo/environment-intelligence

      - name: Run Environment Intelligence demo
        run: npm run demo -w @xo/environment-intelligence

      - name: Lint Environment Intelligence
        run: npx eslint packages/environment-intelligence --max-warnings=0

      - name: Format check Environment Intelligence
        run: npx prettier --check packages/environment-intelligence docs/environment-intelligence/ARCHITECTURE.md
